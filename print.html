<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Leads — Maps Lead Scraper</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        color: #111;
        margin: 0;
        padding: 28px 32px;
        background: #fff;
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }
      .title { display: flex; align-items: center; gap: 10px; }
      .title .pin { font-size: 22px; }
      h1 { font-size: 19px; margin: 0; }
      .meta { font-size: 12px; color: #666; margin-top: 2px; }
      .print-btn {
        border: 0;
        background: #2563eb;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        padding: 9px 16px;
        border-radius: 8px;
        cursor: pointer;
      }
      table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
      thead th {
        background: #f1f5f9;
        text-align: left;
        padding: 8px 9px;
        border: 1px solid #d7dde6;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: #334155;
      }
      tbody td {
        padding: 7px 9px;
        border: 1px solid #e2e8f0;
        vertical-align: top;
      }
      tbody tr:nth-child(even) { background: #fafcff; }
      td a { color: #2563eb; text-decoration: none; word-break: break-all; }
      .empty { color: #64748b; padding: 40px; text-align: center; }
      @media print {
        .print-btn { display: none; }
        body { padding: 0; }
        thead { display: table-header-group; }
        tr { page-break-inside: avoid; }
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="title">
        <span class="pin">📍</span>
        <div>
          <h1>Scraped Leads</h1>
          <div class="meta" id="meta">Maps Lead Scraper</div>
        </div>
      </div>
      <button class="print-btn" id="print">🖨️ Print / Save as PDF</button>
    </div>
    <div id="content"></div>
    <script src="print.js"></script>
  </body>
</html>
